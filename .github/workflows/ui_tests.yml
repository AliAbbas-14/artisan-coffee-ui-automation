name: UI Test Automation CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ui-automation:
    name: Run Playwright BDD Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation_framework/requirements.txt

      - name: Install Playwright Browsers & Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Seed Test Data (Excel, SQLite, Redis Mock)
        run: |
          python automation_framework/data/seed_data.py

      - name: Run Playwright BDD Tests (Behave + Allure)
        env:
          BASE_URL: https://coffee-nu-jade.vercel.app
          BROWSER: chromium
          HEADLESS: "true"
        run: |
          python automation_framework/run_tests.py

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            automation_framework/reports/allure-results/
            automation_framework/reports/test_summary_report.html
          retention-days: 14
